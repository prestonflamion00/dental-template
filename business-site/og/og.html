<!doctype html>
<!-- Link preview image (public/og.jpg). Regenerate with: node og/make-og.mjs (from business-site/). -->
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400..700&family=Plus+Jakarta+Sans:wght@400..800&display=swap">
<style>
  * { box-sizing: border-box; margin: 0; }
  body { width: 1200px; height: 630px; overflow: hidden; position: relative; font-family: "Plus Jakarta Sans", sans-serif; color: #2b2118;
    background: radial-gradient(520px 420px at 92% 18%, #f6d58f, transparent 70%), radial-gradient(460px 380px at 8% 105%, #f3ddc8, transparent 70%), #fbf7ee; }
  .text { position: absolute; left: 72px; top: 0; bottom: 0; width: 560px; display: flex; flex-direction: column; justify-content: center; }
  .logo { font-family: Fraunces, serif; font-weight: 600; font-size: 40px; }
  .logo span { color: #8a5212; }
  .logo small { margin-left: 10px; font-family: "Plus Jakarta Sans", sans-serif; font-size: 20px; font-weight: 700; letter-spacing: .02em; color: #6b5a4c; vertical-align: middle; }
  h1 { font-family: Fraunces, serif; font-weight: 500; font-size: 66px; line-height: 1.04; letter-spacing: -.02em; margin-top: 34px; }
  h1 em { color: #8a5212; }
  p { font-size: 27px; color: #4a3d33; margin-top: 22px; line-height: 1.35; }
  .tag { margin-top: 30px; font-size: 19px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: #8a5212; }
  .phone { position: absolute; width: 230px; }
  .iphone { container-type: inline-size; aspect-ratio: 390 / 844; border-radius: 16% / 7.4%; background: linear-gradient(145deg, #3a3a3d, #1b1b1d 45%, #2c2c2f); box-shadow: inset 0 0 0 1px rgb(255 255 255 / .12), 0 30px 60px -28px rgb(43 33 24 / .55); }
  .iphone .screen { position: absolute; inset: 3.2cqw; border-radius: 13cqw; overflow: hidden; }
  .iphone .screen img { display: block; width: 100%; height: 100%; object-fit: cover; object-position: top; }
  .iphone::after { content: ""; position: absolute; z-index: 2; top: 5.6cqw; left: 50%; translate: -50% 0; width: 29cqw; height: 8.4cqw; border-radius: 99px; background: #000; }
  .iphone::before { content: "9:41"; position: absolute; z-index: 2; top: 6.4cqw; left: 13cqw; font: 600 4.3cqw/1 "Plus Jakarta Sans", sans-serif; color: #111; }
  .p1 { left: 640px; top: 90px; transform: rotate(-7deg); }
  .p2 { left: 800px; top: 40px; transform: rotate(0deg); z-index: 2; }
  .p3 { left: 960px; top: 100px; transform: rotate(7deg); }
</style>
</head>
<body>
  <div class="text">
    <div class="logo">butter<span>bite</span><small>digital</small></div>
    <h1>More new patients, <em>less hassle.</em></h1>
    <p>Websites that make patients feel at home.</p>
    <div class="tag">Websites · Google · Reviews</div>
  </div>
  <div class="phone p1 iphone"><div class="screen"><img src="../public/img/honey-top.webp" alt=""></div></div>
  <div class="phone p2 iphone"><div class="screen"><img src="../public/img/butter-top.webp" alt=""></div></div>
  <div class="phone p3 iphone"><div class="screen"><img src="../public/img/cinnamon-top.webp" alt=""></div></div>
</body>
</html>
